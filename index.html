<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidence Meter</title>
</head>
<body style="margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:white;">
<div style="max-width:560px; margin:0; padding:10px 12px; box-sizing:border-box; color:#222;">
<div style="border-left:5px solid #8D5BC2; padding-left:14px;">
<div style="font-size:18px; font-weight:600; line-height:1.25; margin-bottom:12px;">How confident are you feeling on this topic?</div>
<div style="position:relative; padding:0 8px;">
<div style="position:absolute; left:25px; right:25px; top:18px; height:2px; background:#D9DDE3; pointer-events:none;"></div>
<div style="display:flex; justify-content:space-between; position:relative;">
<button onclick="submitConfidence(1,this)" style="position:relative; z-index:2; width:38px; height:38px; border-radius:50%; border:2px solid #D9DDE3; background:#FFFFFF; cursor:pointer; font-size:15px;">1</button>
<button onclick="submitConfidence(2,this)" style="position:relative; z-index:2; width:38px; height:38px; border-radius:50%; border:2px solid #D9DDE3; background:#FFFFFF; cursor:pointer; font-size:15px;">2</button>
<button onclick="submitConfidence(3,this)" style="position:relative; z-index:2; width:38px; height:38px; border-radius:50%; border:2px solid #D9DDE3; background:#FFFFFF; cursor:pointer; font-size:15px;">3</button>
<button onclick="submitConfidence(4,this)" style="position:relative; z-index:2; width:38px; height:38px; border-radius:50%; border:2px solid #D9DDE3; background:#FFFFFF; cursor:pointer; font-size:15px;">4</button>
<button onclick="submitConfidence(5,this)" style="position:relative; z-index:2; width:38px; height:38px; border-radius:50%; border:2px solid #D9DDE3; background:#FFFFFF; cursor:pointer; font-size:15px;">5</button>
</div>
<div style="display:flex; justify-content:space-between; font-size:12px; color:#555; margin-top:6px;">
<span style="width:100px; text-align:left;">Not confident</span>
<span style="width:100px; text-align:right;">Very confident</span>
</div>
</div>
<div id="confirmation" style="display:none; margin-top:8px; font-size:12px; color:#8D5BC2; font-weight:600;">Response saved.</div>
</div>
</div>
<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkTWVzsTjoHgtsQZyjzVxC_lZhqoxVxJQnlaE9d4HfFaYSRVAi3lLwXv1efKNIWymfAA/exec";
const params = new URLSearchParams(window.location.search);
const lesson = params.get("lesson") || "Unknown";

function submitConfidence(score, button) {
const buttons = document.querySelectorAll("button");
buttons.forEach(function(btn) {
btn.style.background = "#FFFFFF";
btn.style.border = "2px solid #D9DDE3";
btn.style.color = "#222";
});
button.style.background = "#8D5BC2";
button.style.border = "2px solid #8D5BC2";
button.style.color = "#FFFFFF";
document.getElementById("confirmation").style.display = "block";
fetch(GOOGLE_SCRIPT_URL, {
method: "POST",
mode: "no-cors",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
lesson: lesson,
question: "How confident are you feeling on this topic?",
score: score,
timestamp: new Date().toISOString()
})
});
}
</script>
</body>
</html>
